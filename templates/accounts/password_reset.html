{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 p-8">
    <div class="g-card p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Reset your password</h1>
        <p class="text-sm text-slate-500 mb-6">Enter your email and we'll send reset instructions.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required class="g-input" placeholder="you@company.com">
            </div>
            <button type="submit" class="g-btn-primary w-full g-submit-btn">Send Reset Link</button>
        </form>
        <a href="{% url 'accounts:login' %}" class="block text-center text-sm text-primary-light mt-4">Back to login</a>
    </div>
</div>
{% endblock %}
