<div class="mb-6 flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
    <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-primary-light mb-1">{{ role_display }} Dashboard</p>
        <h1 class="text-[28px] font-bold text-slate-900 tracking-tight">
            Welcome, {{ user_obj.get_full_name|default:user_obj.username }}
        </h1>
        <p class="text-sm text-slate-500 mt-1">Overview of your design operations · {{ today|date:"l, d F Y, h:i A" }}</p>
    </div>
    {% if can_admin %}
    <a href="{% url 'admin:index' %}" class="g-btn-primary inline-flex items-center gap-2 shrink-0 self-start">
        <i data-lucide="shield" class="w-4 h-4"></i> Admin Panel
    </a>
    {% endif %}
</div>
