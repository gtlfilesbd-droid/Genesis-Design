{% extends "base.html" %}
{% block title %}Check Your Email{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 p-8">
    <div class="g-card p-8 w-full max-w-md text-center">
        <i data-lucide="mail-check" class="w-12 h-12 text-primary mx-auto mb-4"></i>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Check your email</h1>
        <p class="text-sm text-slate-500 mb-6">If an account exists with that email, password reset instructions have been sent.</p>
        <a href="{% url 'accounts:login' %}" class="g-btn-primary inline-block">Return to Login</a>
    </div>
</div>
{% endblock %}
