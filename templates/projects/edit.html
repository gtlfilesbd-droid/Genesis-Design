{% extends "base.html" %}
{% block title %}Edit {{ project.code }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
    <a href="{% url 'projects:detail' project.pk %}" class="text-sm text-slate-500 hover:text-primary-light inline-flex items-center gap-1 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> {{ project.client_name }}
    </a>
    <h1 class="text-[28px] font-bold text-slate-900 mb-8">Edit Project</h1>
    <div class="g-card p-8">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="g-btn-primary">Save Changes</button>
                <a href="{% url 'projects:detail' project.pk %}" class="g-btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
