{% extends "base.html" %}
{% block title %}{{ action|title }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-xl font-bold text-slate-900 mb-2">{{ action|title }}</h1>
    <p class="text-sm text-slate-500 mb-6">{{ design.design_number }} · {{ design.project.code }}</p>
    <div class="g-card p-6">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <div class="flex gap-3 pt-2">
                <button type="submit" class="g-btn-primary">Submit</button>
                <a href="{% url 'requests:detail' design.pk %}" class="g-btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
