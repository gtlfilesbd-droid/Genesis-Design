{% extends "base.html" %}
{% block title %}Disable User{% endblock %}
{% block content %}
<div class="max-w-md mx-auto" x-data="{ confirm: false }">
    <a href="{% url 'accounts:user_detail' target_user.pk %}" class="text-sm text-slate-500 hover:text-primary-light inline-flex items-center gap-1 mb-6">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to profile
    </a>
    <div class="g-card p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="user-x" class="w-7 h-7"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900 mb-2">Disable {{ target_user.get_full_name }}?</h1>
        <p class="text-sm text-slate-500 mb-6">This user will no longer be able to log in. You can re-enable them later from the edit page.</p>
        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="g-btn-primary w-full !bg-red-600 hover:!bg-red-700">Yes, Disable User</button>
            <a href="{% url 'accounts:user_detail' target_user.pk %}" class="g-btn-secondary w-full block text-center">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
