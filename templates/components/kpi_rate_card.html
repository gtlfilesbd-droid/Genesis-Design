<div class="rate-card">
  <div class="rate-card-body">
    <div class="rate-top">
      <span class="rate-label">{{ card.label }}</span>
      <span class="rate-val" style="color: {{ card.value_color }};">{{ card.value }}{{ card.unit|default:"%" }}</span>
    </div>
    <div class="rate-track">
      <div class="rate-fill" style="--fill-target: {{ card.fill_percent }}%; background: {{ card.fill_color }};"></div>
    </div>
  </div>
</div>
