<div class="relative g-timeline space-y-5 pl-8">
    {% for log in logs %}
    <div class="relative">
        <div class="absolute -left-8 top-1 w-3 h-3 rounded-full bg-blue-500 ring-4 ring-white"></div>
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-semibold text-slate-600 shrink-0">
                {{ log.user|initials }}
            </div>
            <div>
                <p class="text-sm text-slate-900"><span class="font-semibold">{{ log.user|default:"System" }}</span> — {{ log.description|default:log.action }}</p>
                <p class="text-xs text-slate-400 mt-0.5">{{ log.created_at|timesince_short }}</p>
            </div>
        </div>
    </div>
    {% empty %}
    {% include 'components/empty_state.html' with message="No activity yet." icon="activity" %}
    {% endfor %}
</div>
