<div x-data="{ open: false }" x-cloak>
    <button type="button" @click="open = true" class="{{ trigger_class|default:'g-btn-secondary text-sm text-red-600 border-red-200' }}">{{ trigger_label|default:'Disable' }}</button>
    <div x-show="open" x-transition class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40" @keydown.escape.window="open = false">
        <div class="g-card p-6 max-w-md w-full shadow-xl" @click.outside="open = false">
            <div class="flex items-start gap-4 mb-4">
                <div class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
                    <i data-lucide="{{ icon|default:'alert-triangle' }}" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-900">{{ title }}</h3>
                    <p class="text-sm text-slate-500 mt-1">{{ message }}</p>
                </div>
            </div>
            <form method="post" action="{{ action_url }}" class="flex gap-3 justify-end">
                {% csrf_token %}
                {% if hidden_action %}<input type="hidden" name="action" value="{{ hidden_action }}">{% endif %}
                <button type="button" @click="open = false" class="g-btn-secondary">Cancel</button>
                <button type="submit" class="g-btn-primary !bg-red-600 hover:!bg-red-700">{{ confirm_label|default:'Confirm' }}</button>
            </form>
        </div>
    </div>
</div>
