{% if messages %}
<div class="mb-6 space-y-2">
    {% for message in messages %}
    <div class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium
        {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
        {% elif message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
        {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
        <i data-lucide="{% if message.tags == 'error' %}alert-circle{% elif message.tags == 'success' %}check-circle{% else %}info{% endif %}" class="w-4 h-4 shrink-0"></i>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
